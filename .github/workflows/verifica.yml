name: Verifica registro

on:
  push:
    branches: [main, "fix/**"]
  pull_request:

permissions:
  contents: read

jobs:
  regressioni:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Sintassi JavaScript
        run: node --check app.js
      - name: Dati, migrazioni e calcoli
        run: node --test tests/data.test.cjs tests/domain.test.cjs tests/mutation.test.cjs tests/ams-capacity.test.cjs tests/ams-view.test.cjs tests/colors.test.cjs tests/file-backup.test.cjs
